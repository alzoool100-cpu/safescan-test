<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="forgot_password_title">نسيت كلمة المرور</title>
    <link rel="stylesheet" href="base.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
<div class="lang-dropdown">
  <select id="langSelect" onchange="setLanguage(this.value)">
    <option value="ar">العربية</option>
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="ur">اردو</option>
  </select>
</div>

<div class="card" style="max-width: 420px; margin: auto; text-align: center;">
    <div class="logo"><span class="logo-icon">🛡️</span><span class="logo-text">SafeScan</span></div>
    <h1 data-key="forgot_password_title">نسيت كلمة المرور</h1>
    <div class="subtitle" id="pageSubtitle" data-key="forgot_password_sub">أدخل رقم جوالك لاستقبال رمز التحقق</div>

    <form id="forgotForm">
        <div class="input-group" style="position:relative;text-align:right;">
            <label data-key="phone_label" style="display:block;font-weight:500;margin-bottom:6px;color:var(--text-secondary);">رقم الجوال</label>
            <svg style="position:absolute;right:13px;top:38px;width:20px;height:20px;stroke:var(--text-muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 10a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 0h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 7.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <input type="tel" id="phone" placeholder="05xxxxxxxx" required style="padding-right:46px;">
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary" data-key="send_otp_btn">إرسال رمز التحقق</button>
        <div id="errorMsg" class="error-text"></div>
    </form>

    <div id="otpBox" style="display:none; margin-top:16px;">
        <div style="background:var(--color-primary);color:white;border-radius:20px;padding:28px 20px;text-align:center;">
            <div style="font-size:13px;opacity:0.9;margin-bottom:10px;">رمز التحقق الخاص بك</div>
            <div id="otpDisplay" style="font-size:44px;font-weight:700;letter-spacing:10px;font-family:monospace;"></div>
            <div style="font-size:12px;margin-top:10px;opacity:0.8;">⏱️ صالح لمدة 30 دقيقة — لا تشاركه مع أحد</div>
        </div>
        <button onclick="goToReset()" class="btn btn-primary" style="width:100%;margin-top:14px;" data-key="otp_next_btn">
            التالي — إدخال الرمز وتغيير كلمة المرور ←
        </button>
        <p style="font-size:12px;color:var(--text-muted);margin-top:10px;">
            سيصلك أيضاً إشعار على جوالك كنسخة احتياطية
        </p>
    </div>

    <div class="footer-note" style="margin-top: 24px;">
        <a href="/login.html" data-key="back_to_login">العودة لتسجيل الدخول</a>
    </div>

    <div style="margin-top:30px;text-align:center;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
        <a href="/privacy.html" style="color:var(--text-muted);" data-key="privacy_title">سياسة الخصوصية</a> ·
        <a href="/terms.html" style="color:var(--text-muted);" data-key="terms_title">شروط الاستخدام</a> ·
        <a href="/support.html" style="color:var(--text-muted);" data-key="support_link">الدعم الفني</a>
    </div>
</div>

<script src="translations.js"></script>
<script>
    document.getElementById('langSelect').value = currentLang;
    applyTranslations();
    document.getElementById('langSelect').addEventListener('change', function() { setLanguage(this.value); });
    if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark-mode');

    let currentPhone = '';

    function goToReset() {
        sessionStorage.setItem('reset_phone', currentPhone);
        window.location.href = '/reset-password.html';
    }

    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        const errorEl = document.getElementById('errorMsg');
        const btn = document.getElementById('submitBtn');
        errorEl.textContent = '';

        if (!phone) { errorEl.textContent = '❌ الرجاء إدخال رقم الجوال'; return; }

        btn.disabled = true;
        btn.textContent = 'جار الإرسال...';

        try {
            const res = await fetch('/.netlify/functions/reset-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone }),
            });
            if (!res.ok) throw new Error('server_error');
            const data = await res.json();

            currentPhone = phone;
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('pageSubtitle').style.display = 'none';

            const otpBox = document.getElementById('otpBox');
            const otpDisplay = document.getElementById('otpDisplay');

            if (data.otp) {
                otpDisplay.textContent = data.otp;
            } else {
                otpDisplay.textContent = '------';
                otpDisplay.style.fontSize = '18px';
                otpDisplay.style.letterSpacing = '2px';
                otpDisplay.textContent = 'تحقق من إشعار جوالك';
            }

            otpBox.style.display = 'block';

        } catch (err) {
            errorEl.textContent = '❌ حدث خطأ. حاول مجدداً.';
            btn.disabled = false;
            btn.textContent = t('send_otp_btn');
        }
    });
</script>
</body>
</html>
