<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="reset_password_title">إعادة تعيين كلمة المرور</title>
    <link rel="stylesheet" href="base.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        .password-wrapper { position: relative; }
        .toggle-password { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); display:flex; align-items:center; background:none; border:none; padding:4px; user-select: none; }
        .strength-fill { height: 6px; border-radius: 4px; transition: width 0.3s, background 0.3s; width: 0; }
        .strength-label { font-size: 13px; margin-top: 4px; }
        .requirements { list-style: none; padding: 0; margin: 8px 0 0; font-size: 13px; text-align: right; }
        .requirements li { color: var(--color-danger); margin-bottom: 4px; }
        .requirements li.met { color: var(--color-success); text-decoration: none; }
    </style>
</head>
<body>
<div class="lang-dropdown">
  <select id="langSelect" onchange="setLanguage(this.value)">
    <option value="ar">العربية</option>
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="ur">اردو</option>
  </select>
</div>

<div class="card" style="max-width: 420px; margin: auto; text-align: center;">
    <div class="logo"><span class="logo-icon">🛡️</span><span class="logo-text">SafeScan</span></div>
    <h1 data-key="reset_password_title">إعادة تعيين كلمة المرور</h1>
    <div class="subtitle">أدخل رمز التحقق الذي وصلك عبر الإشعار ثم كلمة المرور الجديدة</div>

    <form id="resetForm">
        <div class="input-group">
            <label>رمز التحقق (6 أرقام)</label>
            <input type="text" id="otpInput" placeholder="123456" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required style="letter-spacing:6px; font-size:20px; text-align:center;">
        </div>
        <div class="input-group">
            <label data-key="new_password_label">كلمة المرور الجديدة</label>
            <div class="password-wrapper">
                <input type="password" id="newPassword" placeholder="••••••••" required oninput="checkStrength()">
                <span class="toggle-password" onclick="togglePassword('newPassword', this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>
            <div class="strength-bar" style="background:#e0e0e0; border-radius:4px; margin:8px 0;">
                <div id="strengthFill" class="strength-fill"></div>
            </div>
            <div id="strengthLabel" class="strength-label"></div>
            <ul class="requirements" id="reqList">
                <li id="reqLength" data-key="req_length">❌ 8 حروف إنجليزية على الأقل</li>
                <li id="reqUpper" data-key="req_upper">❌ حرف كبير (A-Z)</li>
                <li id="reqNumber" data-key="req_number">❌ رقم (0-9)</li>
                <li id="reqSymbol" data-key="req_symbol">❌ رمز (@ # $)</li>
            </ul>
        </div>
        <div class="input-group">
            <label data-key="confirm_password_label">تأكيد كلمة المرور</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
                <span class="toggle-password" onclick="togglePassword('confirmPassword', this)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>
        </div>
        <button type="submit" class="btn btn-primary" data-key="save_new_password">حفظ كلمة المرور الجديدة</button>
        <div id="errorMsg" class="error-text"></div>
    </form>

    <div class="footer-note" style="margin-top: 24px;">
        <a href="/login.html" data-key="back_to_login">العودة لتسجيل الدخول</a>
    </div>

    <div style="margin-top: 30px; text-align: center; font-size: 13px; color: var(--text-muted);">
        <a href="/privacy.html" style="color: var(--text-muted);" data-key="privacy_title">سياسة الخصوصية</a> ·
        <a href="/terms.html" style="color: var(--text-muted);" data-key="terms_title">شروط الاستخدام</a> ·
        <a href="/support.html" style="color: var(--text-muted);" data-key="support_title">الدعم</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="translations.js"></script>
<script>
    const supabaseClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    document.getElementById('langSelect').value = currentLang;
    applyTranslations();
    document.getElementById('langSelect').addEventListener('change', function() { setLanguage(this.value); });

    if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark-mode');

    function togglePassword(id, btn) {
        const inp = document.getElementById(id);
        const show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        btn.innerHTML = show
            ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
            : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    }

    function checkStrength() {
        const pw = document.getElementById('newPassword').value;
        const fill = document.getElementById('strengthFill');
        const label = document.getElementById('strengthLabel');
        fill.style.width = '0';
        label.textContent = '';

        if (pw.length === 0) return;

        // الشروط الجديدة
        const lengthOk = (pw.match(/[a-zA-Z]/g) || []).length >= 8; // 8 حروف إنجليزية
        const hasUpper = /[A-Z]/.test(pw);
        const hasNumber = /[0-9]/.test(pw);
        const hasSymbol = /[^A-Za-z0-9]/.test(pw);

        let score = 0;
        if (lengthOk) score++;
        if (hasUpper) score++;
        if (hasNumber) score++;
        if (hasSymbol) score++;

        const percent = (score / 4) * 100;
        fill.style.width = percent + '%';

        let strengthText = '';
        if (score <= 1) { fill.style.background = 'var(--color-danger)'; strengthText = '🔴 ' + t('password_weak'); }
        else if (score <= 3) { fill.style.background = 'var(--color-warning)'; strengthText = '🟡 ' + t('password_medium'); }
        else { fill.style.background = 'var(--color-success)'; strengthText = '🟢 ' + t('password_strong'); }
        label.textContent = strengthText;

        updateRequirement('reqLength', lengthOk, t('req_length'));
        updateRequirement('reqUpper', hasUpper, t('req_upper'));
        updateRequirement('reqNumber', hasNumber, t('req_number'));
        updateRequirement('reqSymbol', hasSymbol, t('req_symbol'));
    }

    function updateRequirement(id, condition, text) {
        const el = document.getElementById(id);
        if (condition) {
            el.classList.add('met');
            el.innerHTML = '✅ ' + text;
        } else {
            el.classList.remove('met');
            el.innerHTML = '❌ ' + text;
        }
    }

    const phone = sessionStorage.getItem('reset_phone') || '';
    if (!phone) {
        document.getElementById('errorMsg').textContent = '❌ رابط غير صالح. ارجع لصفحة نسيت كلمة المرور.';
    }

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const otp = document.getElementById('otpInput').value.trim();
        const newPw = document.getElementById('newPassword').value;
        const confirmPw = document.getElementById('confirmPassword').value;
        const errorEl = document.getElementById('errorMsg');
        errorEl.textContent = '';

        if (!otp || otp.length !== 6) { errorEl.textContent = '❌ الرجاء إدخال رمز التحقق المكون من 6 أرقام.'; return; }
        if (newPw !== confirmPw) { errorEl.textContent = '❌ ' + t('password_mismatch'); return; }

        const letters = (newPw.match(/[a-zA-Z]/g) || []).length;
        if (letters < 8 || !/[A-Z]/.test(newPw) || !/[0-9]/.test(newPw) || !/[^A-Za-z0-9]/.test(newPw)) {
            errorEl.textContent = '❌ ' + t('password_weak_msg');
            return;
        }

        if (!phone) { errorEl.textContent = '❌ الرجاء العودة لصفحة نسيت كلمة المرور.'; return; }

        const btn = e.target.querySelector('button[type=submit]');
        btn.disabled = true;
        btn.textContent = '⏳ جار التحقق...';

        try {
            const res = await fetch('/.netlify/functions/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, otp, new_password: newPw }),
            });
            const data = await res.json();

            if (!res.ok || !data.ok) {
                const msgs = {
                    no_otp: '❌ لم يتم إرسال رمز تحقق لهذا الرقم. ارجع وأرسل الرمز من جديد.',
                    otp_used: '❌ تم استخدام هذا الرمز مسبقاً. ارجع وأرسل رمزاً جديداً.',
                    otp_expired: '❌ انتهت صلاحية الرمز (10 دقائق). ارجع وأرسل رمزاً جديداً.',
                    otp_invalid: '❌ رمز التحقق غير صحيح.',
                    update_failed: '❌ فشل تحديث كلمة المرور. حاول مجدداً.',
                };
                errorEl.textContent = msgs[data.error] || '❌ حدث خطأ. حاول مجدداً.';
                btn.disabled = false;
                btn.textContent = t('save_new_password');
                return;
            }

            sessionStorage.removeItem('reset_phone');
            alert('✅ تم تغيير كلمة المرور بنجاح!');
            window.location.href = '/login.html';
        } catch(err) {
            errorEl.textContent = '❌ حدث خطأ غير متوقع. حاول مجدداً.';
            btn.disabled = false;
            btn.textContent = 'حفظ كلمة المرور الجديدة';
        }
    });
</script>
</body>
</html>
