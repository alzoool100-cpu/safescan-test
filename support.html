<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="support_title">الدعم الفني</title>
    <link rel="stylesheet" href="base.css">
    <style>
        .sup-btn { display:flex; align-items:center; gap:12px; width:100%; padding:16px 18px; border-radius:16px; border:1.5px solid var(--border-color); background:var(--bg-card); color:var(--text-primary); font-size:15px; font-weight:600; cursor:pointer; margin-bottom:10px; text-decoration:none; transition:background .15s; }
        .sup-btn:active { opacity:.8; }
        .sup-btn.wa { background:#25D366; color:#fff; border-color:#25D366; }
        .sup-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:rgba(0,0,0,.06); }
        .sup-icon svg { width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
        .sup-btn.wa .sup-icon { background:rgba(255,255,255,.2); }
        .copy-right { margin-top:28px; font-size:12px; color:var(--text-muted); text-align:center; }
    </style>
</head>
<body>
<div class="lang-dropdown">
  <select id="langSelect" onchange="setLanguage(this.value)">
    <option value="ar">العربية</option><option value="en">English</option><option value="hi">हिन्दी</option><option value="ur">اردو</option>
  </select>
</div>

<div class="card" style="max-width:440px;text-align:center;">
    <div class="logo" style="justify-content:center;margin-bottom:20px;"><span class="logo-icon">🛡️</span><span class="logo-text">SafeScan</span></div>
    <h1 data-key="support_title" style="margin-bottom:6px;">الدعم الفني</h1>
    <p data-key="support_intro" style="margin:0 0 22px;color:var(--text-secondary);font-size:14px;">نحن هنا لخدمتك. تواصل معنا عبر:</p>

    <a href="https://wa.me/966541054516" target="_blank" class="sup-btn wa">
        <div class="sup-icon">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <span data-key="support_whatsapp">واتساب</span>
    </a>

    <a href="mailto:support@safescan.app" class="sup-btn">
        <div class="sup-icon">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <span data-key="support_email">بريد إلكتروني</span>
    </a>

    <a href="tel:+966541054516" class="sup-btn">
        <div class="sup-icon">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 10a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 0h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 7.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </div>
        <span data-key="support_phone">اتصال هاتفي</span>
    </a>

    <div class="copy-right">© SafeScan 2026</div>
</div>

<script src="translations.js"></script>
<script>
    applyTranslations();
    document.getElementById('langSelect').value = currentLang;
    document.getElementById('langSelect').addEventListener('change', function(){ setLanguage(this.value); });
    if(localStorage.getItem('darkMode')==='true') document.documentElement.classList.add('dark-mode');
</script>
</body>
</html>
