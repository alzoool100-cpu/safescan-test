[build]
  command   = "npm install"
  publish   = "."
  functions = "netlify/functions"

[[headers]]
  for = "/OneSignalSDKWorker.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*.sw.js"
  [headers.values]
    Content-Type = "application/javascript"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options           = "DENY"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net onesignal.com *.onesignal.com; connect-src 'self' https://hyvmxyxzwbaneiqbaccs.supabase.co wss://hyvmxyxzwbaneiqbaccs.supabase.co onesignal.com *.onesignal.com; img-src 'self' data: blob: https://hyvmxyxzwbaneiqbaccs.supabase.co onesignal.com *.onesignal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com onesignal.com *.onesignal.com; font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob: onesignal.com *.onesignal.com; frame-src 'self' onesignal.com *.onesignal.com; media-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self';"
