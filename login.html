<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeScan - تسجيل الدخول</title>
    <link rel="stylesheet" href="base.css">
    <script>if(localStorage.getItem('darkMode')==='true')document.documentElement.classList.add('dark-mode');</script>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <style>
        .input-group { position: relative; margin-bottom: 16px; text-align: right; }
        .input-group label { display: block; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .input-group input { padding-right: 46px; }
        .input-group .field-icon { position: absolute; right: 13px; top: 38px; width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
        .lang-dropdown select { font-size: 13px; padding: 8px 32px 8px 12px; }
    </style>
</head>
<body>
    <div class="lang-dropdown">
      <select id="langSelect" onchange="setLanguage(this.value)">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="ur">اردو</option>
      </select>
    </div>

    <div class="card">
        <div class="logo">
            <span class="logo-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
            <span class="logo-text">SafeScan</span>
            <span class="nfc-badge">NFC</span>
        </div>
        <h1 data-key="login_title">تسجيل الدخول</h1>
        <div class="subtitle" data-key="login_sub">لأصحاب السيارات المسجلين</div>

        <form id="loginForm">
            <div class="input-group">
                <label data-key="phone_label">رقم الجوال</label>
                <svg class="field-icon" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 10a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 0h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 7.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                <input type="tel" id="phone" placeholder="05xxxxxxxx">
            </div>
            <div class="input-group">
                <label data-key="password_label">كلمة المرور</label>
                <svg class="field-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="password" data-placeholder="password_label" placeholder="كلمة المرور" style="padding-left:44px;">
                <button type="button" id="eyeBtn" onclick="togglePassVis()" style="position:absolute;left:10px;top:34px;background:none;border:none;cursor:pointer;color:var(--text-muted);padding:4px;display:flex;align-items:center;" aria-label="إظهار كلمة المرور">
                    <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <button type="submit" class="btn btn-primary" data-key="login_btn">دخول</button>
            <div id="errorMsg" class="error-text"></div>
        </form>
        <div style="text-align: left; margin-top: 8px;">
    <a href="/forgot-password.html" style="font-size: 13px; color: var(--text-muted); text-decoration: underline;" data-key="forgot_password_link">نسيت كلمة المرور؟</a>
</div>
        <div class="footer-note">
            <span data-key="no_account">ليس لديك حساب؟</span> <a href="/register.html" style="color: var(--color-primary);" data-key="activate_new">فعّل استيكر جديد</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sel = document.getElementById('langSelect');
            if (sel) sel.value = currentLang;
        });
    </script>
    <script>
        const supabaseClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        if (!supabaseClient) alert('خطأ في تحميل المكتبات.');

        // C30: redirect already-authenticated users straight to dashboard
        // getSession() reads from localStorage — no network call needed
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session?.user) window.location.replace('/dashboard.html');
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMsg');
            const btn = e.target.querySelector('button[type="submit"]');
            errorEl.textContent = '';
            if (!phone || !password) { errorEl.textContent = '❌ الرجاء إدخال البيانات'; return; }
            btn.disabled = true;
            try {
                const email = `${phone}@safescan.local`;
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error || !data?.session) { errorEl.textContent = '❌ بيانات خاطئة'; return; }
                localStorage.setItem('safescan_login_ts', Date.now().toString());
                window.location.href = '/dashboard.html';
            } catch (err) {
                errorEl.textContent = '❌ خطأ في الاتصال. حاول مجدداً.';
            } finally {
                btn.disabled = false;
            }
        });

        function togglePassVis() {
            const inp = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            const isPass = inp.type === 'password';
            inp.type = isPass ? 'text' : 'password';
            // Show eye-off when visible, eye when hidden
            icon.innerHTML = isPass
                ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
                : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
        }
    </script>
</body>
</html>
