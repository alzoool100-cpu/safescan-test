<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeScan - تسجيل الدخول</title>
    <link rel="stylesheet" href="base.css">
    <script>if(localStorage.getItem('darkMode')==='true')document.documentElement.classList.add('dark-mode');</script>
    <script src="config.js"></script>
    <script src="translations.js"></script>
    <style>
        .input-group { position: relative; margin-bottom: 16px; text-align: right; }
        .input-group label { display: block; font-weight: 500; margin-bottom: 6px; color: var(--text-secondary); }
        .input-group input { padding-right: 45px; }
        .input-group .icon { position: absolute; right: 15px; top: 40px; font-size: 18px; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="lang-dropdown">
      <select id="langSelect" onchange="setLanguage(this.value)">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="ur">اردو</option>
      </select>
    </div>

    <div class="card">
        <div class="logo">
            <span class="logo-icon">🛡️</span>
            <span class="logo-text">SafeScan</span>
            <span class="nfc-badge">NFC</span>
        </div>
        <h1 data-key="login_title">تسجيل الدخول</h1>
        <div class="subtitle" data-key="login_sub">لأصحاب السيارات المسجلين</div>

        <form id="loginForm">
            <div class="input-group">
                <label data-key="phone_label">رقم الجوال</label>
                <span class="icon">📱</span>
                <input type="tel" id="phone" placeholder="05xxxxxxxx">
            </div>
            <div class="input-group">
                <label data-key="password_label">كلمة المرور</label>
                <span class="icon">🔒</span>
                <input type="password" id="password" data-placeholder="password_label" placeholder="كلمة المرور" style="padding-left:44px;">
                <button type="button" id="eyeBtn" onclick="togglePassVis()" style="position:absolute;left:10px;top:36px;background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px;padding:4px;" aria-label="إظهار كلمة المرور">👁</button>
            </div>
            <button type="submit" class="btn btn-primary" data-key="login_btn">دخول</button>
            <div id="errorMsg" class="error-text"></div>
        </form>
        <div style="text-align: left; margin-top: 8px;">
    <a href="/forgot-password.html" style="font-size: 13px; color: var(--text-muted); text-decoration: underline;" data-key="forgot_password_link">نسيت كلمة المرور؟</a>
</div>
        <div class="footer-note">
            <span data-key="no_account">ليس لديك حساب؟</span> <a href="/register.html" style="color: var(--color-primary);" data-key="activate_new">فعّل استيكر جديد</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sel = document.getElementById('langSelect');
            if (sel) sel.value = currentLang;
        });
    </script>
    <script>
        const supabaseClient = window.supabase?.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        if (!supabaseClient) alert('خطأ في تحميل المكتبات.');

        // C30: redirect already-authenticated users straight to dashboard
        (async () => {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) window.location.replace('/dashboard.html');
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = '';
            if (!phone || !password) { errorEl.textContent = '❌ الرجاء إدخال البيانات'; return; }
            try {
                const res = await fetch('/.netlify/functions/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password }),
                });
                const data = await res.json();
                if (data.error === 'rate_limited') { errorEl.textContent = '❌ محاولات كثيرة. حاول بعد ساعة.'; return; }
                if (data.error || !data.ok) { errorEl.textContent = '❌ بيانات خاطئة'; return; }
                await supabaseClient.auth.setSession({ access_token: data.access_token, refresh_token: data.refresh_token });
                localStorage.setItem('safescan_login_ts', Date.now().toString());
                window.location.href = '/dashboard.html';
            } catch (err) {
                errorEl.textContent = '❌ خطأ في الاتصال. حاول مجدداً.';
            }
        });

        function togglePassVis() {
            const inp = document.getElementById('password');
            const btn = document.getElementById('eyeBtn');
            inp.type = inp.type === 'password' ? 'text' : 'password';
            btn.textContent = inp.type === 'password' ? '👁' : '🙈';
        }
    </script>
</body>
</html>
