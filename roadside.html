<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="roadside_title">خدمات الطريق والطوارئ</title>
    <link rel="stylesheet" href="base.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --clr-em: #DC2626;
            --clr-em-bg: #FEF2F2;
            --clr-em-border: #FECACA;
            --clr-najm: #EA580C;
            --clr-najm-bg: #FFF7ED;
            --clr-najm-border: #FED7AA;
            --clr-road: #D97706;
            --clr-road-bg: #FFFBEB;
            --clr-road-border: #FDE68A;
            --clr-tr: #2563EB;
            --clr-tr-bg: #EFF6FF;
            --clr-tr-border: #BFDBFE;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --clr-em-bg: #450a0a; --clr-em-border: #7f1d1d;
                --clr-najm-bg: #431407; --clr-najm-border: #7c2d12;
                --clr-road-bg: #422006; --clr-road-border: #78350f;
                --clr-tr-bg: #172554; --clr-tr-border: #1e3a8a;
            }
        }
        :root[data-theme="dark"] {
            --clr-em-bg: #450a0a; --clr-em-border: #7f1d1d;
            --clr-najm-bg: #431407; --clr-najm-border: #7c2d12;
            --clr-road-bg: #422006; --clr-road-border: #78350f;
            --clr-tr-bg: #172554; --clr-tr-border: #1e3a8a;
        }

        .page-hdr {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
        }
        .back-btn {
            background: none; border: none; cursor: pointer;
            padding: 8px; border-radius: 8px; color: var(--text-secondary);
            display: flex; align-items: center; flex-shrink: 0;
        }
        .back-btn:hover { background: var(--bg-tag); }
        .page-title { font-size: 16px; font-weight: 700; flex: 1; text-align: center; }

        /* Section cards */
        .sc {
            border-radius: 16px; padding: 18px; margin-bottom: 14px;
            border: 1.5px solid;
        }
        .sc-em   { background: var(--clr-em-bg);   border-color: var(--clr-em-border); }
        .sc-najm { background: var(--clr-najm-bg); border-color: var(--clr-najm-border); }
        .sc-road { background: var(--clr-road-bg); border-color: var(--clr-road-border); }
        .sc-tr   { background: var(--clr-tr-bg);   border-color: var(--clr-tr-border); }

        .sc-hdr {
            display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
        }
        .sc-icon {
            width: 38px; height: 38px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .sc-icon svg {
            width: 20px; height: 20px; stroke: white; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .ic-em   { background: var(--clr-em); }
        .ic-najm { background: var(--clr-najm); }
        .ic-road { background: var(--clr-road); }
        .ic-tr   { background: var(--clr-tr); }
        .sc-title { font-size: 16px; font-weight: 700; }

        /* Emergency number grid */
        .em-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .em-btn {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 4px; padding: 14px 8px;
            border-radius: 12px; border: none; cursor: pointer;
            text-decoration: none; background: var(--clr-em); color: white;
            transition: opacity 0.15s;
        }
        .em-btn:hover { opacity: 0.85; }
        .em-num { font-size: 24px; font-weight: 800; font-family: monospace; letter-spacing: 1px; }
        .em-lbl { font-size: 11px; opacity: 0.9; text-align: center; }

        /* Najm buttons */
        .najm-list { display: flex; flex-direction: column; gap: 8px; }
        .najm-btn {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 12px;
            border: 1.5px solid var(--clr-najm-border);
            background: var(--bg-card); color: var(--text-primary);
            cursor: pointer; text-decoration: none;
            transition: background 0.15s;
        }
        .najm-btn:hover { background: rgba(234,88,12,0.07); }
        .najm-ic {
            width: 34px; height: 34px; border-radius: 9px;
            background: var(--clr-najm);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .najm-ic svg {
            width: 17px; height: 17px; stroke: white; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .najm-txt-main { font-size: 14px; font-weight: 700; }
        .najm-txt-sub  { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        /* Road assistance */
        .road-list { display: flex; flex-direction: column; gap: 8px; }
        .road-btn {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: 12px;
            border: 1.5px solid var(--clr-road-border);
            background: var(--bg-card); color: var(--text-primary);
            cursor: pointer; text-decoration: none;
            transition: background 0.15s;
        }
        .road-btn:hover { background: rgba(217,119,6,0.07); }
        .road-ic {
            width: 34px; height: 34px; border-radius: 9px;
            background: var(--clr-road);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .road-ic svg {
            width: 17px; height: 17px; stroke: white; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        /* Transport */
        .tr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .tr-btn {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            padding: 18px 12px; border-radius: 14px;
            border: 1.5px solid var(--clr-tr-border);
            background: var(--bg-card); color: var(--text-primary);
            cursor: pointer; font-weight: 700; font-size: 14px;
            transition: background 0.15s;
        }
        .tr-btn:hover { background: rgba(37,99,235,0.07); }
        .tr-logo {
            width: 52px; height: 52px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 800; font-size: 12px;
        }
        .logo-careem { background: #1DBF73; }
        .logo-uber   { background: #000000; }

        .v-footer-links { text-align: center; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border-color); }
        .v-footer-links a { font-size: 11px; color: var(--text-muted); text-decoration: none; }
        .v-footer-links a + a::before { content: " · "; }
    </style>
</head>
<body>
<script>if(localStorage.getItem('darkMode')==='true')document.documentElement.classList.add('dark-mode');</script>

<div class="lang-dropdown">
    <select id="langSelect" onchange="setLanguage(this.value)">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="ur">اردو</option>
    </select>
</div>

<div class="card" style="max-width: 480px; margin: auto;">

    <!-- Header -->
    <div class="page-hdr">
        <button class="back-btn" onclick="history.back()" aria-label="رجوع">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
        </button>
        <div class="logo" style="margin:0;">
            <span class="logo-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </span>
            <span class="logo-text">SafeScan</span>
        </div>
        <h1 class="page-title" data-key="roadside_title">خدمات الطريق والطوارئ</h1>
    </div>

    <!-- ① Emergency -->
    <div class="sc sc-em">
        <div class="sc-hdr">
            <div class="sc-icon ic-em">
                <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            </div>
            <span class="sc-title" data-key="emergency_section">طوارئ فورية</span>
        </div>
        <div class="em-grid">
            <a href="tel:911" class="em-btn">
                <span class="em-num">911</span>
                <span class="em-lbl" data-key="emergency_unified">الطوارئ الموحد</span>
            </a>
            <a href="tel:997" class="em-btn">
                <span class="em-num">997</span>
                <span class="em-lbl" data-key="emergency_ambulance">الإسعاف</span>
            </a>
            <a href="tel:998" class="em-btn">
                <span class="em-num">998</span>
                <span class="em-lbl" data-key="emergency_civil">الدفاع المدني</span>
            </a>
            <a href="tel:996" class="em-btn">
                <span class="em-num">996</span>
                <span class="em-lbl" data-key="emergency_traffic">المرور</span>
            </a>
        </div>
    </div>

    <!-- ② Najm -->
    <div class="sc sc-najm">
        <div class="sc-hdr">
            <div class="sc-icon ic-najm">
                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            </div>
            <span class="sc-title" data-key="najm_section">نجم للحوادث</span>
        </div>
        <div class="najm-list">
            <a href="tel:920001717" class="najm-btn">
                <div class="najm-ic">
                    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </div>
                <div>
                    <div class="najm-txt-main" data-key="call_btn">اتصال</div>
                    <div class="najm-txt-sub" dir="ltr">920001717</div>
                </div>
            </a>
            <button class="najm-btn" onclick="openApp('najm://', 'https://apps.apple.com/sa/app/najm/id1036605820', 'https://play.google.com/store/apps/details?id=com.najm.customer')">
                <div class="najm-ic">
                    <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
                </div>
                <div>
                    <div class="najm-txt-main" data-key="open_app_btn">فتح التطبيق</div>
                    <div class="najm-txt-sub" data-key="app_install_hint">يُنزَّل تلقائياً إن لم يكن مثبتاً</div>
                </div>
            </button>
            <a href="https://www.najm.com.sa" target="_blank" rel="noopener" class="najm-btn">
                <div class="najm-ic">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                </div>
                <div>
                    <div class="najm-txt-main" data-key="visit_site_btn">الموقع الرسمي</div>
                    <div class="najm-txt-sub" dir="ltr">www.najm.com.sa</div>
                </div>
            </a>
        </div>
    </div>

    <!-- ③ Roadside Assistance -->
    <div class="sc sc-road">
        <div class="sc-hdr">
            <div class="sc-icon ic-road">
                <svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            </div>
            <span class="sc-title" data-key="roadside_section">مساعدة الطريق</span>
        </div>
        <div class="road-list">
            <a href="tel:920000560" class="road-btn">
                <div class="road-ic">
                    <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </div>
                <div>
                    <div class="najm-txt-main" data-key="road_safety">أمن الطرق</div>
                    <div class="najm-txt-sub" dir="ltr">920000560</div>
                </div>
            </a>
            <a href="https://maps.google.com/?q=سطحة+قريبة" target="_blank" rel="noopener" class="road-btn">
                <div class="road-ic">
                    <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                </div>
                <div>
                    <div class="najm-txt-main" data-key="tow_truck">البحث عن سطحة</div>
                    <div class="najm-txt-sub" data-key="tow_via_maps">عبر خرائط Google</div>
                </div>
            </a>
        </div>
    </div>

    <!-- ④ Transport -->
    <div class="sc sc-tr">
        <div class="sc-hdr">
            <div class="sc-icon ic-tr">
                <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="12" rx="3"/><path d="M5 7l2.5-4h9L19 7"/><circle cx="7" cy="17" r="1.5"/><circle cx="17" cy="17" r="1.5"/></svg>
            </div>
            <span class="sc-title" data-key="transport_section">مواصلات</span>
        </div>
        <div class="tr-grid">
            <button class="tr-btn" onclick="openApp('careem://', 'https://apps.apple.com/app/careem/id592978487', 'https://play.google.com/store/apps/details?id=com.careem.acma')">
                <div class="tr-logo logo-careem">
                    <svg width="28" height="28" viewBox="0 0 60 60" fill="none"><circle cx="30" cy="30" r="30" fill="#1DBF73"/><text x="30" y="38" text-anchor="middle" font-size="20" fill="white" font-family="sans-serif" font-weight="bold">C</text></svg>
                </div>
                <span>Careem</span>
            </button>
            <button class="tr-btn" onclick="openApp('uber://', 'https://apps.apple.com/app/uber/id368677368', 'https://play.google.com/store/apps/details?id=com.ubercab')">
                <div class="tr-logo logo-uber">
                    <svg width="28" height="28" viewBox="0 0 60 60" fill="none"><circle cx="30" cy="30" r="30" fill="#000"/><text x="30" y="38" text-anchor="middle" font-size="20" fill="white" font-family="sans-serif" font-weight="bold">U</text></svg>
                </div>
                <span>Uber</span>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <div class="v-footer-links">
        <a href="/privacy.html" data-key="privacy_title">سياسة الخصوصية</a>
        <a href="/terms.html" data-key="terms_title">شروط الاستخدام</a>
        <a href="/support.html" data-key="support_link">الدعم الفني</a>
    </div>

</div>

<script src="translations.js"></script>
<script>
    if (localStorage.getItem('darkMode') === 'true') document.documentElement.classList.add('dark-mode');
    document.getElementById('langSelect').value = currentLang;
    applyTranslations();
    document.getElementById('langSelect').addEventListener('change', function() { setLanguage(this.value); });

    function openApp(deepLink, iosUrl, androidUrl) {
        const ua = navigator.userAgent;
        const isIOS = /iPhone|iPad|iPod/i.test(ua);
        const isAndroid = /Android/i.test(ua);
        const fallback = isIOS ? iosUrl : (isAndroid ? androidUrl : iosUrl);

        window.location.href = deepLink;

        const timer = setTimeout(function() {
            window.location.href = fallback;
        }, 1500);

        window.addEventListener('pagehide', function() { clearTimeout(timer); }, { once: true });
        window.addEventListener('blur',     function() { clearTimeout(timer); }, { once: true });
    }
</script>
</body>
</html>
